services:
  license-server:
    build: .
    working_dir: /etc/offline-license
    ports:
      - "127.0.0.1:${LICENSE_COMPOSE_PORT:-8443}:${LICENSE_COMPOSE_PORT:-8443}"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /etc/offline-license/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets
        target: /etc/offline-license/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    restart: unless-stopped
