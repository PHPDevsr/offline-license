name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected a release tag in vMAJOR.MINOR.PATCH format, got %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release archives
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              name="license-server-${GITHUB_REF_NAME}-${os}-${arch}"
              binary=license-server
              if [[ "$os" == windows ]]; then
                binary=license-server.exe
              fi
              GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -o "dist/$name/$binary" .
              cp -R migrations .env.example "dist/$name/"
              if [[ "$os" == windows ]]; then
                (cd dist && zip -qr "$name.zip" "$name")
              else
                tar -czf "dist/$name.tar.gz" -C dist "$name"
              fi
            done
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --generate-notes
